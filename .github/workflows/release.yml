name: Release

# Pushing a tag vX.Y.Z (the plugin version) creates a DRAFT GitHub release
# with the installable ZIP and its SHA-256. The project owner tests the ZIP on
# staging and publishes the draft by hand (docs/DEVELOPMENT.md#release).
on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: Package and draft release
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      # Needed to create the draft release and upload its assets.
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history (all branches), to check that the tagged commit is
          # on main.
          fetch-depth: 0
          persist-credentials: false

      - name: Tagged commit must be on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG ($GITHUB_SHA) is not on main."
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # Builds the dashboard and runs bin/package.mjs, which fails unless the
      # tag is v<plugin version> on HEAD, the versions agree and are SemVer,
      # the runtime files match the commit and the ZIP reads back correctly.
      - name: Build and package
        run: npm run package -- --tag "$TAG"

      - name: Validate ZIP
        run: |
          zip="dist/merchboard-mvp-${TAG#v}.zip"
          test -f "$zip"
          unzip -tq "$zip"
          if unzip -Z1 "$zip" | grep -v '^merchboard/'; then
            echo "::error::Entries outside merchboard/."
            exit 1
          fi
          for file in merchboard.php uninstall.php src/Plugin.php build/dashboard.js build/dashboard.asset.php languages/merchboard-da_DK.mo; do
            unzip -Z1 "$zip" | grep -qx "merchboard/$file" || { echo "::error::Missing $file"; exit 1; }
          done
          (cd dist && sha256sum "$(basename "$zip")" > "$(basename "$zip").sha256")
          cat "$zip.sha256"

      - name: Release notes from CHANGELOG
        run: |
          # The section "## [X.Y.Z]" up to the next "## [".
          awk -v v="${TAG#v}" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' docs/CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::docs/CHANGELOG.md has no section ## [${TAG#v}]."
            exit 1
          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" \
            --draft \
            --verify-tag \
            --title "Merch Dashboard ${TAG#v}" \
            --notes-file release-notes.md \
            "dist/merchboard-mvp-${TAG#v}.zip" \
            "dist/merchboard-mvp-${TAG#v}.zip.sha256"
