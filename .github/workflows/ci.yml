name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs the same checks before it packages a tag.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP (lint + static analysis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          # Minimum supported version (see "Requires PHP" in the plugin header).
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: PHP syntax check
        run: find . -path ./vendor -prune -o -path ./node_modules -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: PHPCS (WordPress Coding Standards)
        run: composer lint

      - name: PHPStan
        run: composer analyse

      - name: PHPUnit
        run: composer test

  integration:
    name: PHP integration (MySQL)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2
          extensions: mysqli

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      # The Ubuntu runner image ships a MySQL server (documented default login
      # root/root, not a secret). It exists only for this job; the test run
      # prints the exact server version.
      - name: Start MySQL
        run: |
          sudo systemctl start mysql.service
          mysql -h 127.0.0.1 -uroot -proot -e 'SELECT VERSION()'

      - name: Integration tests (real WordPress + MySQL)
        run: node bin/integration.mjs
        env:
          MERCHBOARD_TEST_DB_HOST: 127.0.0.1
          MERCHBOARD_TEST_DB_PORT: '3306'
          MERCHBOARD_TEST_DB_NAME: merchboard_tests
          MERCHBOARD_TEST_DB_USER: root
          MERCHBOARD_TEST_DB_PASSWORD: root

  php-legacy-syntax:
    name: PHP 7.2 syntax (requirement check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The main file and the requirement check must parse on old PHP so users
      # get an admin notice instead of a fatal error (see src/Core/Requirements.php).
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.2'
          coverage: none
          tools: none

      - name: PHP 7.2 syntax check
        run: |
          php -l merchboard.php
          php -l src/Core/Requirements.php
          php -l uninstall.php

  js:
    name: JS (lint, types, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint:js

      - name: Stylelint
        run: npm run lint:css

      - name: TypeScript (strict)
        run: npm run typecheck

      - name: Jest
        run: npm run test:js

      - name: Build
        run: npm run build
